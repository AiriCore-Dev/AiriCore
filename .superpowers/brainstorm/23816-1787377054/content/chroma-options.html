<h2>选择 UI / 道具色键底</h2>
<p class="subtitle">关注边缘抗锯齿、绿色物件冲突和批量处理稳定性</p>
<div class="cards">
  <div class="card" data-choice="green" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#00ff00;padding:28px">
      <div style="height:150px;background:#00ff00;display:grid;place-items:center;border:3px solid #ff3b81">
        <div style="width:116px;height:84px;background:#f7f9ff;border:10px solid #4aa5ff;box-shadow:0 0 0 5px #ff4b91;border-radius:18px;transform:rotate(-6deg)"></div>
      </div>
    </div>
    <div class="card-body"><h3>纯绿 #00FF00</h3><p>背景与主体颜色分离要求最高，适合白色、蓝色、珊瑚红道具。</p></div>
  </div>
  <div class="card" data-choice="blue" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0055ff;padding:28px">
      <div style="height:150px;background:#0055ff;display:grid;place-items:center;border:3px solid #ffdf4a">
        <div style="width:116px;height:84px;background:#f7f9ff;border:10px solid #ff5a98;box-shadow:0 0 0 5px #62e6c6;border-radius:18px;transform:rotate(6deg)"></div>
      </div>
    </div>
    <div class="card-body"><h3>纯蓝 #0055FF</h3><p>与绿色极光和薄荷色素材更容易冲突，但能保护绿色细节。</p></div>
  </div>
  <div class="card" data-choice="dual" onclick="toggleSelect(this)">
    <div class="card-image" style="background:linear-gradient(90deg,#00ff00 0 50%,#0055ff 50%);padding:28px">
      <div style="height:150px;background:linear-gradient(90deg,#00ff00 0 50%,#0055ff 50%);display:grid;place-items:center;border:3px solid white">
        <div style="width:116px;height:84px;background:#f7f9ff;border:10px solid #ff5a98;box-shadow:0 0 0 5px #62e6c6;border-radius:18px"></div>
      </div>
    </div>
    <div class="card-body"><h3>双通道绿 / 蓝</h3><p>同一素材生成两份底色，取边缘一致区域，最稳但请求量与验收成本翻倍。</p></div>
  </div>
</div>
